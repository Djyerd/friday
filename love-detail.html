<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>WHAT I LOVE — ガンバ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0c;
        --bg-elevated: #12121a;
        --card-border: rgba(168, 85, 247, 0.12);
        --text: #e8e8ed;
        --text-muted: #9898a8;
        --purple: #a855f7;
        --blue: #3b82f6;
        --gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 45%, #3b82f6 100%);
        --radius-sm: 12px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Outfit", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.65;
        min-height: 100vh;
      }
      .jp {
        font-family: "M PLUS Rounded 1c", "Outfit", sans-serif;
      }
      .wrap {
        width: min(640px, 100% - 40px);
        margin: 48px auto 64px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-muted);
        text-decoration: none;
        letter-spacing: 0.06em;
        margin-bottom: 28px;
        transition: color 0.2s;
      }
      .back:hover {
        color: var(--purple);
      }
      article {
        padding: 28px 26px;
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        border: 1px solid var(--card-border);
      }
      .emoji {
        font-size: 2.25rem;
        margin: 0 0 12px;
        line-height: 1;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lead {
        margin: 0 0 22px;
        font-size: 0.92rem;
        color: var(--text-muted);
      }
      .lead.jp {
        color: var(--text);
        opacity: 0.92;
      }
      h2 {
        margin: 22px 0 10px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--purple);
        text-transform: uppercase;
      }
      h2:first-of-type {
        margin-top: 0;
      }
      p {
        margin: 0 0 12px;
        font-size: 0.88rem;
        color: var(--text-muted);
      }
      p:last-child {
        margin-bottom: 0;
      }
      ul {
        margin: 0;
        padding-left: 1.2rem;
        font-size: 0.88rem;
        color: var(--text-muted);
      }
      li {
        margin-bottom: 10px;
      }
      li:last-child {
        margin-bottom: 0;
      }
      .sub {
        display: block;
        margin-top: 4px;
        font-size: 0.78rem;
        opacity: 0.85;
      }
      .notfound {
        text-align: center;
        padding: 40px 20px;
      }
      .notfound p {
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="index.html">← Back to portfolio</a>
      <article id="love-article" hidden></article>
      <article id="love-notfound" class="notfound" hidden>
        <h1 class="jp" style="color: var(--text)">ページが見つかりません</h1>
        <p class="jp">ポートフォリオの「WHAT I LOVE」から項目を選び直してください。</p>
      </article>
    </div>
    <script>
      /* TOPICS を編集すると、趣味の詳細文や推しの差し替えができます。 */
      var TOPICS = {
        basketball: {
          emoji: "🏀",
          titleEn: "Basketball",
          leadJp:
            "コートでの連携や、一瞬で流れが変わる一球に魅かれています。体を動かす時間と、試合を観る時間のどちらも大切にしています。",
          sections: [
            {
              h: "Teams & heroes",
              body:
                '<p class="jp">NBAでは <strong>San Antonio Spurs</strong> を応援しています。チームバスケの美学と、細かいプレーの積み重ねが好きです。</p><p class="jp">プレースタイルやメンタル面で憧れがあるのは <strong>Kobe Bryant</strong>。妥協しない姿勢は、コードに向き合うときのモチベーションにもつながっています。</p>',
            },
            {
              h: "Why it sticks",
              body:
                '<p class="jp">勝ち負けだけでなく、練習・フィルムスタディ・仲間とのコミュニケーションまで含めて「バスケ」だと捉えています。フロントエンドと似ていて、小さな反復が試合当天の質をつくる感覚があります。</p>',
            },
          ],
        },
        anime: {
          emoji: "📺",
          titleEn: "Anime",
          leadJp:
            "週末や夜更かししがちな夜は、アニメでリセットする時間が欠かせません。世界観に浸ったり、セリフの温度感を味わったりするのが好きです。",
          sections: [
            {
              h: "All-time pick",
              body:
                '<ul class="jp">' +
                "<li><strong>HUNTER×HUNTER（ハンター×ハンター）</strong><span class=\"sub\">念能力バトルの緻密さと、友情・成長の描き方のバランスが絶妙。何度見ても新しい発見があります。</span></li>" +
                "</ul>",
            },
            {
              h: "What I enjoy",
              body:
                '<p class="jp">長編でじっくり世界に入り込む作品と、短い尺で感情がぎゅっとまとまっている作品の両方を楽しみます。作画のキレや、音楽と絵の同期しているカットにゾクッとすることが多いです。</p>',
            },
          ],
        },
        music: {
          emoji: "🎵",
          titleEn: "Music",
          leadJp:
            "作業中の集中、移動中の気分転換、夜のリラックス——シチュエーションごとにプレイリストを切り替えるのが日課です。歌詞のストーリーとビートの両方を大事に聴きます。",
          sections: [
            {
              h: "On repeat",
              body:
                '<ul>' +
                "<li><strong>J. Cole</strong> — 「Wet Dreamz」<span class=\"sub jp\">アルバム『2014 Forest Hills Drive』収録。シンプルなビートの上で、青年期の青さとユーモアが自然に語られる一曲。</span></li>" +
                "</ul>",
            },
            {
              h: "How I use it",
              body:
                '<p class="jp">コーディング中はドラムの粒が細かすぎないトラックを選びがちです。リファクタリングやUI調整の「地味な工程」こそ、耳元のノリが生産性に効いてくる気がしています。</p>',
            },
          ],
        },
        coding: {
          emoji: "💻",
          titleEn: "Coding",
          leadJp:
            "見た目と挙動が滑らかにつながった瞬間が一番たまりません。仕様をどう表現するかを考え、試し、直すループがずっと続いています。",
          sections: [
            {
              h: "References I trust",
              body:
                '<ul class="jp">' +
                "<li><strong>MDN Web Docs / Can I use</strong> — 挙動の確認とブラウザ差分のチェック。</li>" +
                "<li><strong>React 公式ドキュメント</strong> — 概念整理とベストプラクティスの再確認。</li>" +
                "<li><strong>UIインスピレーション</strong> — Dribbble や Awwwards でレイアウトやタイポグラフィの刺激をもらう。</li>" +
                "</ul>",
            },
            {
              h: "What keeps it fun",
              body:
                '<p class="jp">ユーザーが迷わず目標に辿り着ける導線、キーボードでも触れるUI、読み込み体感の細かなチューニング——「細部の積み重ね」ほど達成感の大きい作業は少ないです。</p>',
            },
          ],
        },
      };

      function render(topic) {
        var data = TOPICS[topic];
        var el = document.getElementById("love-article");
        var nf = document.getElementById("love-notfound");
        if (!data) {
          el.hidden = true;
          nf.hidden = false;
          document.title = "WHAT I LOVE — ガンバ";
          return;
        }
        document.title = data.titleEn + " — WHAT I LOVE | ガンバ";
        var html =
          '<p class="emoji" aria-hidden="true">' +
          data.emoji +
          '</p><h1>' +
          data.titleEn +
          '</h1><p class="lead jp">' +
          data.leadJp +
          "</p>";
        data.sections.forEach(function (s) {
          html += "<h2>" + s.h + "</h2>" + s.body;
        });
        el.innerHTML = html;
        el.hidden = false;
        nf.hidden = true;
      }

      var params = new URLSearchParams(window.location.search);
      render(params.get("topic") || "");
    </script>
  </body>
</html>
